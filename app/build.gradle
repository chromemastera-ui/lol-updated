plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lol.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lol.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // A fixed signing key: every future build is signed the same way, so new versions install over the old app and keep its data.
    signingConfigs {
        debug {
            storeFile file('lol-debug.keystore')
            storePassword 'lolpass123'
            keyAlias 'lol'
            keyPassword 'lolpass123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
